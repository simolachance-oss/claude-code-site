<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Architecture — Plateforme IA pour PME de services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <div class="board" id="board">
      <!-- header injected -->
      <div id="header-slot"></div>
      <!-- layers injected -->
      <div id="layers-slot"></div>
      <!-- flow ribbon -->
      <div id="flow-slot"></div>
      <!-- footer / legal -->
      <div id="footer-slot"></div>
      <!-- arrows overlay -->
      <svg id="arrows" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
    </div>
  </div>
  <script src="render.js" defer></script>
</body>
</html>
